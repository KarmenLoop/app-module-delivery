<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Application responsibilities and adaptation</title>
  <desc id="desc">Target entry points use business use cases and modules, which coordinate concrete data, system, and external capabilities. This is a logical view.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#648075" stroke-width="1.5"/></marker></defs>
  <rect width="1280" height="440" rx="24" fill="#f3f4ef"/>
  <text x="52" y="64" fill="#193d35" font-family="Arial, sans-serif" font-size="28" font-weight="700">Shared meaning. Clear ownership. Appropriate interfaces.</text>
  <g fill="#fff" stroke="#b7c8c1" stroke-width="1.5"><rect x="52" y="126" width="280" height="206" rx="16"/><rect x="408" y="126" width="400" height="206" rx="16"/><rect x="884" y="126" width="344" height="206" rx="16"/></g>
  <g stroke="#648075" stroke-width="2" marker-end="url(#arrow)"><path d="M338 230H398"/><path d="M814 230H874"/></g>
  <g font-family="Arial, sans-serif">
    <g fill="#193d35" font-size="23" font-weight="700"><text x="76" y="170">Target entry points</text><text x="432" y="170">Use cases and modules</text><text x="908" y="170">Concrete capabilities</text></g>
    <g fill="#4c6059" font-size="17">
      <text x="76" y="214">Desktop / mobile / web / CLI</text><text x="76" y="247">Navigation and interaction</text><text x="76" y="280">Progress, results, recovery</text>
      <text x="432" y="214">Public contracts and authorization</text><text x="432" y="247">Rules, state, transactions, ownership</text><text x="432" y="280">Observable outcomes and tests</text>
      <text x="908" y="214">Persistence and files</text><text x="908" y="247">Platform-specific adapters</text><text x="908" y="280">Owned and external integrations</text>
    </g>
    <text x="52" y="388" fill="#4c6059" font-size="16">Logical responsibilities can share a process. Deployment follows actual requirements and constraints.</text>
  </g>
</svg>
